<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c24">
<meta name="description" content="Fluento — Learn, Play, Grow">
<title>FLUENTO ULTIMATE</title>

<link rel="icon" href="fluento-icon.png">

<style>
:root{
 --bg:#080c24;--panel:#111936;--panel2:#17234a;
 --ink:#f2f5ff;--muted:#a5b1d4;
 --cyan:#50eaff;--blue:#397bff;--purple:#a56bff;
 --pink:#ff6bd6;--gold:#ffd66b;--green:#53e6a3;
 --red:#ff6d88;--line:#33416d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
body{
 background:radial-gradient(ellipse at 15% 0%,#1b2860,transparent 38%),
 radial-gradient(ellipse at 90% 20%,#27154e,transparent 34%),var(--bg);
 color:var(--ink);font:15px/1.5 system-ui,sans-serif;
 min-height:100vh;min-height:100dvh;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{
 background:#0b1430;color:white;border:1px solid #465580;
 border-radius:11px;padding:12px;width:100%;margin:4px 0;
}
button:focus-visible,input:focus-visible{
 outline:2px solid var(--cyan);outline-offset:3px
}
.hidden{display:none!important}

header{
 position:sticky;top:0;z-index:20;
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;padding:10px 14px;
 background:#080c24ed;backdrop-filter:blur(18px);
 border-bottom:1px solid var(--line);
}
.brand{font-size:1.35rem;font-weight:1000;display:flex;align-items:center;gap:9px}
.brandmark{
 width:40px;height:40px;display:grid;place-items:center;
 border-radius:13px;background:linear-gradient(135deg,#783bff,#00cfff)
}
.stats{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.pill{
 background:#141d3c;border:1px solid #46558c;
 padding:5px 9px;border-radius:30px;font-weight:850;font-size:.8rem
}
.layout{
 width:100%;min-height:calc(100dvh - 62px);
 display:grid;grid-template-columns:205px minmax(0,1fr);
 gap:18px;padding:18px;max-width:1450px;margin:auto
}
.side{
 position:sticky;top:80px;align-self:start;
 background:#0e1532;border:1px solid var(--line);
 border-radius:20px;padding:12px
}
.side button{
 display:block;width:100%;padding:12px;margin:3px 0;
 border-radius:12px;background:transparent;color:var(--muted);
 text-align:left;font-weight:850
}
.side button.active,.side button:hover{background:#1a2b57;color:white}
.main{min-width:0;width:100%}
.panel{
 background:linear-gradient(145deg,#121c3a,#0e1732);
 border:1px solid var(--line);border-radius:19px;padding:16px;
 margin:12px 0;box-shadow:0 12px 35px #0005
}
.hero{
 display:flex;align-items:center;justify-content:space-between;
 gap:15px;padding:22px;border-radius:24px;
 border:1px solid #5365b0;
 background:linear-gradient(120deg,#141c53,#172d63 55%,#3a1760);
 overflow:hidden
}
.hero h1{font-size:clamp(1.7rem,4vw,2.7rem);margin:5px 0;line-height:1.1}
.hero p{color:#d2ddff}
.eyebrow{
 font-size:.72rem;letter-spacing:1.5px;
 font-weight:950;color:var(--cyan)
}
.muted{color:var(--muted);font-size:.9rem}
.section-head{margin:22px 0 10px}
.section-head h2{margin:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row>*{min-width:0}
.primary,.secondary,.danger{
 padding:10px 15px;border-radius:12px;font-weight:900
}
.primary{background:linear-gradient(110deg,#554cff,#087fca)}
.secondary{background:#1b2a50;border:1px solid #4a5d92}
.danger{background:#4b1d36;border:1px solid #9c385b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.metric{background:#121e40;border:1px solid var(--line);padding:14px;border-radius:15px}
.metric strong{font-size:1.5rem;display:block}
.metric span{color:var(--muted);font-size:.8rem}
.track{height:9px;background:#263355;border-radius:30px;overflow:hidden;margin:12px 0}
.fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan))}
.stage{
 display:grid;grid-template-columns:44px 1fr auto;
 gap:10px;align-items:center;padding:12px;
 background:#111b39;border:1px solid var(--line);
 border-radius:15px;margin:9px 0
}
.stage.locked{opacity:.45}
.stage-icon{
 width:44px;height:44px;display:grid;place-items:center;
 background:#25316b;border-radius:13px;font-size:23px
}
.stage h3{margin:0;font-size:1rem}
.stage p{margin:2px 0;color:var(--muted);font-size:.8rem}
.quiz{max-width:750px;margin:15px auto}
.question{font-size:clamp(1.35rem,4vw,1.9rem)}
.option{
 width:100%;text-align:left;padding:14px;
 border:1px solid #42517b;background:#121d3d;
 border-radius:13px;margin:5px 0;font-weight:800
}
.option.selected{border-color:var(--cyan);background:#18365b}
.option.correct{border-color:var(--green);background:#123c3b}
.option.wrong{border-color:var(--red);background:#461f3c}
.option:disabled{opacity:1}
.feedback{padding:12px;border-radius:12px;margin-top:12px;font-weight:850}
.good{background:#103c38;color:#9dffda}
.bad{background:#4a1e35;color:#ffd2dd}
.ollie-wrap{position:relative;width:145px;flex-shrink:0}
.ollie{
 width:100%;border-radius:20px;
 animation:float 3s ease-in-out infinite;
 filter:drop-shadow(0 0 20px #4b6bff77)
}
.speech{
 position:absolute;top:-12px;right:-10px;
 background:linear-gradient(120deg,#1b9de7,#7b45ff);
 padding:7px 10px;border-radius:15px;
 font-weight:900;max-width:145px;font-size:.8rem
}
@keyframes float{50%{transform:translateY(-9px)}}
@keyframes bounce{
 0%,100%{transform:translateY(0) rotate(0)}
 30%{transform:translateY(-25px) rotate(-8deg)}
 65%{transform:translateY(-8px) rotate(8deg)}
}
.celebrate{animation:bounce .5s ease 5}
.gift{
 background:linear-gradient(135deg,#241b58,#39265f);
 border:1px solid #8267c6;border-radius:17px;
 padding:18px;text-align:center;margin:15px 0
}
.gift .big{font-size:55px}
.friend{
 display:flex;align-items:center;gap:10px;
 padding:12px 0;border-bottom:1px solid #2c3a60
}
.avatar{
 width:44px;height:44px;display:grid;place-items:center;
 background:#26315f;border-radius:14px;font-size:23px
}
.friendinfo{flex:1;min-width:0}
.friendinfo small{display:block;color:var(--muted)}
.friend-card{cursor:pointer}
.request{
 padding:12px;border:1px solid var(--line);
 border-radius:14px;margin:9px 0;background:#142044
}
.weekly{
 border:1px solid #8267c6;
 background:linear-gradient(120deg,#25205d,#132f64);
 border-radius:15px;padding:15px;margin:12px 0
}
.notice{
 padding:12px;background:#342c1a;color:#ffe8a4;
 border:1px solid #806c32;border-radius:12px;margin:10px 0
}
.bottom{display:none}
.authbox{max-width:460px;margin:6vh auto;padding:22px}
.authbox form{display:grid;gap:9px}

/* WELCOME SCREEN */
.splash{
 position:fixed;inset:0;z-index:9999;
 display:grid;place-items:center;padding:15px;
 background:radial-gradient(circle at center,#192c83,#050817 75%);
 animation:fadeOut .6s ease 3s forwards
}
.splash-content{text-align:center;width:min(95vw,500px)}
.splash-director{
 color:#ffe37b;font-size:13px;font-weight:900;
 letter-spacing:2px;margin-bottom:12px
}
.splash-logo{
 width:min(85vw,420px);max-height:65dvh;
 object-fit:contain;animation:logoFloat 2s infinite;
 filter:drop-shadow(0 0 25px #328cff88)
}
.splash-tag{font-weight:900;letter-spacing:3px;margin-top:10px}
@keyframes logoFloat{50%{transform:translateY(-9px)}}
@keyframes fadeOut{to{opacity:0;visibility:hidden;pointer-events:none}}

/* MOBILE FULL SCREEN */
@media(max-width:760px){
 .layout{display:block;padding:10px 10px 90px}
 .side{display:none}
 .main{width:100%;min-height:calc(100dvh - 65px)}
 .hero{padding:15px}
 .ollie-wrap{width:105px}
 header{padding:8px}
 .brand{font-size:1.05rem}
 .pill{font-size:.68rem;padding:5px 6px}
 .bottom{
  display:flex;position:fixed;bottom:0;left:0;right:0;
  z-index:50;justify-content:space-around;
  background:#080d25f5;border-top:1px solid var(--line);
  padding:7px 3px max(7px,env(safe-area-inset-bottom))
 }
 .bottom button{
  background:transparent;color:var(--muted);
  font-size:.7rem;font-weight:850
 }
 .bottom span{display:block;font-size:1.25rem}
 .stage{grid-template-columns:40px 1fr}
 .stage button{grid-column:2;justify-self:start}
 .authbox{margin:18px 10px;max-width:none}
}
</style>
</head>

<body>

<!-- WELCOME ANIMATION -->
<div class="splash" id="splash">
 <div class="splash-content">
  <div class="splash-director">DIRECTED BY MR. NIRMIT POHANE</div>
  <img class="splash-logo" src="fluento-icon.png" alt="Fluento">
  <div class="splash-tag">LEARN • PLAY • GROW</div>
 </div>
</div>

<header>
 <div class="brand"><div class="brandmark">🦉</div> FLUENTO</div>
 <div class="stats">
  <div class="pill">🔥 <b id="streak">0</b></div>
  <div class="pill">⚡ <b id="xp">0</b></div>
  <div class="pill">🪙 <b id="coins">0</b></div>
  <div class="pill">💎 <b id="gems">0</b></div>
  <div class="pill">❤️ <b id="hearts">3</b></div>
 </div>
</header>

<section id="authScreen" class="authbox panel">
 <div class="eyebrow">LEARN • PLAY • GROW</div>
 <h1>Welcome to Fluento!</h1>
 <p class="muted">Learn a little every day with Ollie.</p>
 <form id="authForm">
  <input id="authName" placeholder="Nickname (new account)" maxlength="24">
  <input id="authEmail" type="email" placeholder="Email address" required>
  <input id="authPassword" type="password" minlength="8" placeholder="Password (8+ characters)" required>
  <div class="row">
   <button class="primary" type="submit">Sign in</button>
   <button class="secondary" type="button" id="signup">Create account</button>
  </div>
 </form>
 <p id="authMessage" class="muted"></p>
 <button class="secondary" id="guest">Continue as guest</button>
</section>

<div id="appShell" class="hidden">
 <div class="layout">
  <aside class="side">
   <div style="text-align:center;padding:12px">🦉 OLLIE'S CLUB</div>
   <button data-tab="learn">🗺️ Learn</button>
   <button data-tab="friends">👥 Friends</button>
   <button data-tab="rewards">🎁 Rewards</button>
   <button data-tab="profile">🏆 Profile</button>
   <button data-tab="feedback">✉️ Feedback</button>
   <button data-tab="dashboard" id="adminNav" class="hidden">📊 Director</button>
   <button id="logout">↪ Sign out</button>
  </aside>
  <main id="app" class="main"></main>
 </div>
 <nav class="bottom">
  <button data-tab="learn"><span>🗺️</span>Learn</button>
  <button data-tab="friends"><span>👥</span>Friends</button>
  <button data-tab="rewards"><span>🎁</span>Gifts</button>
  <button data-tab="profile"><span>🏆</span>Profile</button>
 </nav>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
 getAuth,onAuthStateChanged,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,signOut,updateProfile
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

import {
 getFirestore,doc,setDoc,getDoc,updateDoc,
 collection,query,where,getDocs,addDoc,onSnapshot,
 serverTimestamp,limit,runTransaction
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

/* =====================================
   1. FIREBASE CONFIGURATION
===================================== */

const firebaseConfig={
 apiKey:"PASTE_API_KEY",
 authDomain:"PASTE_PROJECT.firebaseapp.com",
 projectId:"PASTE_PROJECT_ID",
 appId:"PASTE_APP_ID"
};

const ADMIN_UID="PASTE_YOUR_FIREBASE_AUTH_UID";

const firebaseReady=Object.values(firebaseConfig).every(
 v=>v&&!String(v).startsWith("PASTE_")
);

let auth=null,db=null,user=null,guest=false;
if(firebaseReady){
 const fb=initializeApp(firebaseConfig);
 auth=getAuth(fb);
 db=getFirestore(fb);
}

/* =====================================
   2. APP DATA
===================================== */

const $=id=>document.getElementById(id);
const app=$("app");
const localKey="fluento-ultimate-v3";

const base={
 nickname:"Learner",
 course:"English",
 xp:0,coins:0,gems:0,hearts:3,
 streak:0,shield:"None",
 stage:1,done:{},practiceDays:[],
 lastPractice:"",weeklyClaimed:[],
 sound:true,music:true,volume:0.12,
 notificationsEnabled:false
};

let data={
 ...base,
 ...JSON.parse(localStorage.getItem(localKey)||"{}")
};

let currentStage=1;
let questionIndex=0;
let score=0;
let selected=-1;
let answered=false;
let audio=null;
let musicNodes=null;
let unsubFriends=null;
let unsubRequests=null;
let unsubProfile=null;

/* =====================================
   3. QUESTION BANK
   Each stage selects a different set.
===================================== */

const banks={

 English:[
 ["Choose a greeting.",["Hello","Under","Because","Quickly"],0,"Hello is a greeting."],
 ["Opposite of cold?",["Hot","Slow","Small","Quiet"],0,"Hot is the opposite of cold."],
 ["Complete: How ___ you?",["are","is","am","be"],0,"Use are with you."],
 ["Past tense of go?",["Went","Goed","Going","Go"],0,"Go becomes went."],
 ["Choose a polite word.",["Please","Never","Maybe","Under"],0,"Please is polite."],
 ["Plural of child?",["Children","Childs","Childes","Child"],0,"Children is the plural."],
 ["Which is a noun?",["Teacher","Quickly","Beautiful","Run"],0,"Teacher names a person."],
 ["Choose the correct article: ___ apple.",["An","A","Thee","No"],0,"Use an before a vowel sound."],
 ["Opposite of ancient?",["Modern","Old","Past","Historic"],0,"Modern is the opposite."],
 ["Which is a verb?",["Jump","Blue","Table","Happy"],0,"Jump is an action."],
 ["Complete: She ___ singing.",["is","are","am","be"],0,"Use is with she."],
 ["Past tense of eat?",["Ate","Eated","Eating","Eats"],0,"Eat becomes ate."],
 ["Synonym of happy?",["Joyful","Angry","Tired","Sad"],0,"Joyful means happy."],
 ["Which is an adjective?",["Beautiful","Slowly","Run","Chair"],0,"Beautiful describes something."],
 ["Choose the correct spelling.",["Because","Becaus","Beacause","Becose"],0,"Because is correct."],
 ["Complete: They ___ playing.",["are","is","am","was"],0,"Use are with they."],
 ["Opposite of victory?",["Defeat","Success","Win","Prize"],0,"Defeat is the opposite."],
 ["Which is a pronoun?",["They","School","Running","Green"],0,"They is a pronoun."],
 ["Choose the future tense.",["Will go","Went","Goes","Going"],0,"Will go expresses the future."],
 ["What is the plural of mouse?",["Mice","Mouses","Mousees","Mices"],0,"Mice is the plural."]
 ],

 Spanish:[
 ["How do you say Hello?",["Hola","Adiós","Gracias","Agua"],0,"Hola means hello."],
 ["What does Gracias mean?",["Please","Thank you","Good night","Friend"],1,"Gracias means thank you."],
 ["Choose water in Spanish.",["Pan","Agua","Casa","Libro"],1,"Agua means water."],
 ["What does Por favor mean?",["Please","Goodbye","Sorry","Welcome"],0,"Por favor means please."],
 ["Complete Buenos ___.",["días","libros","amigos","agua"],0,"Buenos días means good morning."],
 ["What does Adiós mean?",["Goodbye","Hello","Thanks","Water"],0,"Adiós means goodbye."],
 ["What is friend in Spanish?",["Amigo","Casa","Libro","Agua"],0,"Amigo means friend."],
 ["What does Casa mean?",["House","Food","Water","Book"],0,"Casa means house."],
 ["Choose book.",["Libro","Perro","Gato","Sol"],0,"Libro means book."],
 ["What does Sí mean?",["Yes","No","Maybe","Please"],0,"Sí means yes."],
 ["What is dog?",["Perro","Gato","Pájaro","Pez"],0,"Perro means dog."],
 ["What is cat?",["Gato","Perro","Casa","Flor"],0,"Gato means cat."],
 ["What does Rojo mean?",["Red","Blue","Green","Yellow"],0,"Rojo means red."],
 ["What does Azul mean?",["Blue","Red","Black","White"],0,"Azul means blue."],
 ["Choose one.",["Uno","Dos","Tres","Cuatro"],0,"Uno means one."],
 ["What does Dos mean?",["Two","One","Three","Four"],0,"Dos means two."],
 ["What is school?",["Escuela","Casa","Agua","Libro"],0,"Escuela means school."],
 ["What is good night?",["Buenas noches","Buenos días","Hola","Gracias"],0,"Buenas noches means good night."],
 ["What is mother?",["Madre","Padre","Amigo","Hermana"],0,"Madre means mother."],
 ["What is father?",["Padre","Madre","Amiga","Casa"],0,"Padre means father."]
 ],

 Hindi:[
 ["“नमस्ते” का अर्थ?",["अभिवादन","पानी","किताब","घर"],0,"नमस्ते अभिवादन है."],
 ["“पानी” का अर्थ?",["Water","Book","Friend","School"],0,"पानी means water."],
 ["“धन्यवाद” का अर्थ?",["Thank you","Goodbye","Please","Friend"],0,"धन्यवाद means thank you."],
 ["“मित्र” का अर्थ?",["Friend","Food","House","Book"],0,"मित्र means friend."],
 ["“घर” का अर्थ?",["House","School","Water","Day"],0,"घर means house."],
 ["“विद्यालय” का अर्थ?",["School","River","Garden","Book"],0,"विद्यालय means school."],
 ["“सूरज” का अर्थ?",["Sun","Moon","Star","Cloud"],0,"सूरज means sun."],
 ["“चंद्रमा” का अर्थ?",["Moon","Sun","Rain","Wind"],0,"चंद्रमा means moon."],
 ["“पुस्तक” का अर्थ?",["Book","Pen","Chair","Table"],0,"पुस्तक means book."],
 ["“सुंदर” का अर्थ?",["Beautiful","Ugly","Angry","Slow"],0,"सुंदर means beautiful."],
 ["“तेज़” का अर्थ?",["Fast","Slow","Weak","Quiet"],0,"तेज़ means fast."],
 ["“दिन” का अर्थ?",["Day","Night","Morning","Evening"],0,"दिन means day."],
 ["“रात” का अर्थ?",["Night","Day","Sun","Cloud"],0,"रात means night."],
 ["“आकाश” का अर्थ?",["Sky","Earth","Water","Fire"],0,"आकाश means sky."],
 ["“पेड़” का अर्थ?",["Tree","Flower","Fruit","Leaf"],0,"पेड़ means tree."],
 ["“फल” का अर्थ?",["Fruit","Tree","Flower","Water"],0,"फल means fruit."],
 ["“खुशी” का अर्थ?",["Happiness","Sadness","Anger","Fear"],0,"खुशी means happiness."],
 ["“साहस” का अर्थ?",["Courage","Fear","Sleep","Food"],0,"साहस means courage."],
 ["“परिवार” का अर्थ?",["Family","School","Friend","Village"],0,"परिवार means family."],
 ["“प्रेम” का अर्थ?",["Love","Hate","Anger","Fear"],0,"प्रेम means love."]
 ]
};

/* Stage-specific deterministic question selection.
   Consecutive stages use different questions. */

function stageQuestions(stage){
 const bank=banks[data.course]||banks.English;
 const start=((stage-1)*5)%bank.length;
 const result=[];
 for(let i=0;i<5;i++){
  result.push(bank[(start+i)%bank.length]);
 }
 return result;
}

/* =====================================
   4. BASIC HELPERS
===================================== */

function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function save(){
 localStorage.setItem(localKey,JSON.stringify(data));
 updateStats();
}

function updateStats(){
 $("xp").textContent=data.xp||0;
 $("coins").textContent=data.coins||0;
 $("gems").textContent=data.gems||0;
 $("hearts").textContent=data.hearts??3;
 $("streak").textContent=data.streak||0;
}

function stageKey(n){return data.course+":"+n}
function completed(n){return !!data.done[stageKey(n)]}

function highestStage(){
 let n=1;
 while(completed(n))n++;
 return n;
}

function shieldFor(n){
 if(n>=35)return "Diamond";
 if(n>=28)return "Platinum";
 if(n>=21)return "Gold";
 if(n>=14)return "Silver";
 if(n>=7)return "Bronze";
 return "None";
}

/* =====================================
   5. AUDIO SYSTEM
===================================== */

function startAudio(){
 if(!data.sound)return;
 const C=window.AudioContext||window.webkitAudioContext;
 if(!C)return;
 audio??=new C();
 audio.resume();
}

function playTone(freq,duration=.16,type="sine",volume=.06){
 if(!data.sound)return;
 startAudio();
 if(!audio)return;
 const o=audio.createOscillator();
 const g=audio.createGain();
 o.type=type;
 o.frequency.value=freq;
 const now=audio.currentTime;
 g.gain.setValueAtTime(.001,now);
 g.gain.linearRampToValueAtTime(volume,now+.02);
 g.gain.exponentialRampToValueAtTime(.001,now+duration);
 o.connect(g);g.connect(audio.destination);
 o.start(now);o.stop(now+duration+.02);
}

function sound(kind){
 const notes={
  ok:[523,659,784],
  bad:[220,185],
  gift:[523,659,784,1046],
  tap:[440],
  level:[392,523,659,784]
 };
 (notes[kind]||[440]).forEach((n,i)=>
  setTimeout(()=>playTone(n,.2),i*130)
 );
}

/* Original ambient synthesised music.
   It is not copied from another app or song. */

function startMusic(){
 if(!data.music||musicNodes)return;
 startAudio();
 if(!audio)return;
 const osc1=audio.createOscillator();
 const osc2=audio.createOscillator();
 const gain=audio.createGain();
 const filter=audio.createBiquadFilter();

 osc1.type="sine";
 osc2.type="triangle";
 osc1.frequency.value=110;
 osc2.frequency.value=164.81;
 filter.type="lowpass";
 filter.frequency.value=350;
 gain.gain.value=Math.max(0,Math.min(.035,data.volume));

 osc1.connect(filter);
 osc2.connect(filter);
 filter.connect(gain);
 gain.connect(audio.destination);
 osc1.start();osc2.start();
 musicNodes={osc1,osc2,gain};
}

function stopMusic(){
 if(!musicNodes)return;
 try{
  musicNodes.osc1.stop();
  musicNodes.osc2.stop();
 }catch{}
 musicNodes=null;
}

},{once:true});

===================================== */

function recordDay(){
 const today=new Date().toISOString().slice(0,10);
 if(data.practiceDays.includes(today))return;

 const yesterday=new Date(Date.now()-86400000)
  .toISOString().slice(0,10);

 data.streak=data.lastPractice===yesterday
  ?(data.streak||0)+1:1;

 data.lastPractice=today;
 data.practiceDays.push(today);
 data.practiceDays=data.practiceDays.slice(-100);
 data.shield=shieldFor(data.streak);

 if(data.streak%7===0&&!data.weeklyClaimed.includes(data.streak)){
  data.weeklyClaimed.push(data.streak);
  data.coins+=50;
  data.gems+=10;
  data.xp+=100;
  data.weeklyGift={
   streak:data.streak,
   date:today
  };
 }
}

function startStage(n){
 currentStage=n;
 questionIndex=0;
 score=0;
 selected=-1;
 answered=false;
 data.hearts=3;
 showQuestion();
}

function currentQuestion(){
 return stageQuestions(currentStage)[questionIndex];
}

function showQuestion(){
 const q=currentQuestion();

 app.innerHTML=`
 <div class="quiz">
  <div class="row">
   <button class="secondary" id="quit">✕ Exit</button>
   <div class="track" style="flex:1">
    <div class="fill" style="width:${questionIndex*20}%"></div>
   </div>
   <b>❤️ ${data.hearts}</b>
  </div>

  <div class="panel">
   <div class="eyebrow">
    STAGE ${currentStage} · QUESTION ${questionIndex+1}/5
   </div>
   <h2 class="question">${esc(q[0])}</h2>

   <div id="options">
    ${q[1].map((v,i)=>`
     <button class="option" data-option="${i}">
      ${esc(v)}
     </button>
    `).join("")}
   </div>

   <div id="feedback"></div>
   <div class="row" style="justify-content:flex-end">
    <button class="primary" id="check" disabled>Check answer</button>
   </div>
  </div>
 </div>`;

 $("quit").onclick=()=>nav("learn");

 document.querySelectorAll("[data-option]").forEach(b=>{
  b.onclick=()=>{
   if(answered)return;
   selected=+b.dataset.option;
   document.querySelectorAll("[data-option]").forEach(x=>
    x.classList.toggle("selected",x===b)
   );
   $("check").disabled=false;
  };
 });

 $("check").onclick=checkAnswer;
}

function checkAnswer(){
 if(selected<0||answered)return;
 answered=true;

 const q=currentQuestion();
 const correct=selected===q[2];

 document.querySelectorAll("[data-option]").forEach((b,i)=>{
  b.disabled=true;
  if(i===q[2])b.classList.add("correct");
  if(i===selected&&!correct)b.classList.add("wrong");
 });

 if(correct){
  score++;
  sound("ok");
  $("feedback").className="feedback good";
  $("feedback").textContent="Correct! "+q[3];
 }else{
  data.hearts--;
  sound("bad");
  $("feedback").className="feedback bad";
  $("feedback").textContent="Not quite. "+q[3];
 }

 updateStats();

 const button=$("check");
 button.disabled=false;
 button.textContent=data.hearts===0?"Out of hearts":
  questionIndex===4?"Finish stage":"Continue";

 button.onclick=()=>{
  if(data.hearts===0){heartChoice();return;}
  questionIndex++;
  selected=-1;
  answered=false;
  if(questionIndex<5)showQuestion();
  else finishStage();
 };
}

async function sendFriendRequest(to){
 if(!user||!db)return;
 if(to===user.uid)return;

 const existing=query(
  collection(db,"friendRequests"),
  where("from","==",user.uid),
  where("to","==",to),
  where("status","==","pending"),
  limit(1)
 );

 const found=await getDocs(existing);
 if(!found.empty){
  alert("Request already sent.");
  return;
 }

 const incoming=query(
  collection(db,"friendRequests"),
  where("from","==",to),
  where("to","==",user.uid),
  where("status","==","pending"),
  limit(1)
 );

 const incomingSnap=await getDocs(incoming);
 if(!incomingSnap.empty){
  alert("This learner has already sent you a request. Accept it in Friend requests.");
  return;
 }

 await addDoc(collection(db,"friendRequests"),{
  from:user.uid,
  to:to,
  fromName:data.nickname,
  status:"pending",
  createdAt:serverTimestamp()
 });

 alert("Friend request sent!");
}

/* A recipient can accept or reject.
   Accepted requests create one mutual friendship document. */

async function handleRequest(requestId,action){
 if(!user||!db)return;

 const ref=doc(db,"friendRequests",requestId);

 await runTransaction(db,async tx=>{
  const snap=await tx.get(ref);
  if(!snap.exists())throw Error("Request no longer exists.");

  const r=snap.data();
  if(r.to!==user.uid||r.status!=="pending")
   throw Error("This request is no longer available.");

  tx.update(ref,{
   status:action,
   respondedAt:serverTimestamp()
  });

  if(action==="accepted"){
   const friendshipId=[r.from,user.uid].sort().join("_");
   tx.set(doc(db,"friendships",friendshipId),{
    members:[r.from,user.uid],
    createdAt:serverTimestamp()
   });
  }
 });

 await loadFriends();
}

function listenFriendRequests(){
 if(!user||!db)return;

 if(unsubRequests)unsubRequests();

 unsubRequests=onSnapshot(
  query(collection(db,"friendRequests"),
   where("to","==",user.uid),
   where("status","==","pending")),
  snap=>{
   const box=$("incomingRequests");
   if(!box)return;

   if(snap.empty){
    box.textContent="No new friend requests.";
    return;
   }

   box.innerHTML=snap.docs.map(d=>{
    const r=d.data();
    return `
     <div class="request">
      <b>${esc(r.fromName||"A learner")}</b>
      <p>Sent you a friend request!</p>
      <div class="row">
       <button class="primary" data-accept="${d.id}">✓ Accept</button>
       <button class="danger" data-reject="${d.id}">✕ Reject</button>
      </div>
     </div>`;
   }).join("");

   box.querySelectorAll("[data-accept]").forEach(b=>{
    b.onclick=()=>handleRequest(b.dataset.accept,"accepted");
   });
   box.querySelectorAll("[data-reject]").forEach(b=>{
    b.onclick=()=>handleRequest(b.dataset.reject,"rejected");
   });
  }
 );

 onSnapshot(
  query(collection(db,"friendRequests"),
   where("from","==",user.uid),
   where("status","==","pending")),
  snap=>{
   const box=$("sentRequests");
   if(box)box.innerHTML=snap.empty?"No pending sent requests.":
    snap.docs.map(d=>`<p>Request sent · Waiting for response</p>`).join("");
  }
 );
}

async function loadFriends(){
 if(!user||!db){
  $("myFriends").textContent="Sign in to add online friends.";
  return;
 }

 listenFriendRequests();

 if(unsubFriends)unsubFriends();

 unsubFriends=onSnapshot(
  query(collection(db,"friendships"),
   where("members","array-contains",user.uid)),
  async snap=>{
   const box=$("myFriends");
   if(!box)return;

   const friendIds=[];
   snap.docs.forEach(d=>{
    const id=d.data().members.find(x=>x!==user.uid);
    if(id)friendIds.push(id);
   });

   if(!friendIds.length){
    box.textContent="No friends yet. Search by nickname!";
    return;
   }

   const profiles=await Promise.all(friendIds.map(async id=>{
    const p=await getDoc(doc(db,"publicProfiles",id));
    return p.exists()?p.data():null;
   }));

   const valid=profiles.filter(Boolean).sort((a,b)=>(b.xp||0)-(a.xp||0));

   box.innerHTML=valid.map((p,i)=>`
    <div class="friend friend-card" data-viewfriend="${esc(p.uid)}">
     <div class="avatar">🦉</div>
     <div class="friendinfo">
      <b>#${i+1} ${esc(p.nickname)}</b>
      <small>Stage ${p.stage||1} · ${p.xp||0} XP · ${esc(p.shield||"None")}</small>
     </div>

   box.querySelectorAll("[data-viewfriend]").forEach(b=>{

   });
  }
 );
}

  <input id="volume" type="range" min="0" max="0.3" step="0.01" value="${data.volume}" style="padding:0">
  <p class="muted">Soft original ambient music. You can turn it off anytime.</p>

  <hr style="border-color:var(--line);margin:18px 0">
  <h3>🔔 Notifications</h3>
  <label><input type="checkbox" id="notificationToggle" ${data.notificationsEnabled?"checked":""} style="width:auto"> Enable reminders</label>
  <button class="secondary" id="enableNotifications">Allow browser notifications</button>
 </div>`;
}

/* =====================================
   16. NOTIFICATIONS
===================================== */

async function enableNotifications(){
 if(!("Notification"in window)){
  alert("This browser does not support notifications.");
  return;
 }
 const permission=await Notification.requestPermission();
 if(permission==="granted"){
  data.notificationsEnabled=true;
  persist();
  alert("Notifications enabled!");
 }else{
  alert("Please allow notifications in your browser settings.");
 }
}

function notify(message){
 if(!data.notificationsEnabled)return;
 if(!("Notification"in window))return;
 if(Notification.permission==="granted"){
  new Notification("Fluento 🦉",{body:message,icon:"fluento-icon.png"});
 }
}

function dailyReminder(){
 const today=new Date().toISOString().slice(0,10);
 if(data.lastReminder===today)return;
 data.lastReminder=today;
 save();

 if(!data.practiceDays.includes(today)){
  setTimeout(()=>{
   notify("You haven't completed today's lesson. I believe in you! Keep your progress going! 🦉");
  },3000);
 }
}

/* Foreground reminders only.
   Reliable background notifications need a service worker and push server. */

/* =====================================
   17. FEEDBACK
===================================== */

function feedbackView(){
 return `
 <div class="hero">
  <div><div class="eyebrow">HELP FLUENTO GROW</div>
  <h1>Send feedback</h1>
  <p>Help us improve your learning experience.</p></div>
  <div style="font-size:50px">✉️</div>
 </div>
 <div class="panel">
  <select id="feedbackType">
   <option>Suggestion</option>
   <option>Bug report</option>
   <option>Lesson correction</option>
  </select>
  <textarea id="feedbackText" placeholder="Write your feedback..."></textarea>
  <button class="primary" id="sendFeedback">Send</button>
  <p id="feedbackStatus"></p>
 </div>`;
}

async function sendFeedback(){
 const message=$("feedbackText").value.trim();
 if(message.length<5)return;
 if(!user||!db){
  $("feedbackStatus").textContent="Sign in to submit feedback.";
  return;
 }
 await addDoc(collection(db,"feedback"),{
  uid:user.uid,
  nickname:data.nickname,
  type:$("feedbackType").value,
  message,
  createdAt:serverTimestamp()
 });
 $("feedbackStatus").textContent="Thank you for your feedback!";
}

/* =====================================
   18. DIRECTOR ANALYTICS
===================================== */

function dashboardView(){
 if(!user||user.uid!==ADMIN_UID){
  return '<div class="notice">Director access only.</div>';
 }

 return `
 <div class="hero">
  <div><div class="eyebrow">DIRECTOR CONTROL ROOM</div>
  <h1>Welcome, Nirmit.</h1>
  <p>Fluento learning analytics.</p></div>
  <div style="font-size:50px">📊</div>
 </div>
 <div id="adminStats" class="grid"></div>
 <div class="panel">
  <h2>Registered learners</h2>
  <div id="userRows">Loading...</div>
 </div>
 <div class="notice">
  Private email addresses are not exposed in this client-side dashboard.
  Secure email administration requires a protected server-side Firebase Admin service.
 </div>`;
}

let adminUnsub=null;

function loadAdmin(){
 if(!user||user.uid!==ADMIN_UID||!db)return;
 if(adminUnsub)adminUnsub();

 adminUnsub=onSnapshot(collection(db,"publicProfiles"),snap=>{
  const profiles=snap.docs.map(d=>d.data());

  $("adminStats").innerHTML=`
   <div class="metric"><strong>${profiles.length}</strong><span>Total learners</span></div>
   <div class="metric"><strong>${profiles.filter(p=>
    p.updatedAt?.toDate&&Date.now()-p.updatedAt.toDate().getTime()<604800000
   ).length}</strong><span>Active this week</span></div>
   <div class="metric"><strong>${profiles.reduce((a,p)=>a+(p.xp||0),0)}</strong><span>Total XP</span></div>
   <div class="metric"><strong>${profiles.filter(p=>p.stage>1).length}</strong><span>Progressing learners</span></div>
  `;

  $("userRows").innerHTML=profiles.map(p=>`
   <div class="friend">
    <div class="avatar">🦉</div>
    <div class="friendinfo">
     <b>${esc(p.nickname)}</b>
     <small>Stage ${p.stage||1} · ${p.xp||0} XP · ${esc(p.shield||"None")}</small>
    </div>
   </div>
  `).join("");
 });
}

/* =====================================
   19. EVENT HANDLERS
===================================== */

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-start]");
 if(b)startStage(+b.dataset.start);

 if(e.target.id==="findFriend")findFriend();
 if(e.target.id==="sendFeedback")sendFeedback();
 if(e.target.id==="enableNotifications")enableNotifications();

 if(e.target.id==="copyID"){
  const id=user?"FL-"+user.uid.slice(0,8).toUpperCase():"GUEST";
  navigator.clipboard?.writeText(id)
   .then(()=>alert("Fluento ID copied!"))
   .catch(()=>alert(id));
 }

 if(e.target.id==="saveNickname"){
  const name=$("nickname").value.trim();
  if(name.length<2){alert("Nickname is too short.");return;}
  data.nickname=name;
  persist();
  cloudSave().then(render);
 }
});

document.addEventListener("change",e=>{
 if(e.target.id==="courseSelect"){
  data.course=e.target.value;
  persist();render();
 }

 if(e.target.id==="soundToggle"){
  data.sound=e.target.checked;
  persist();
 }

 if(e.target.id==="musicToggle"){
  data.music=e.target.checked;
  if(data.music)startMusic();else stopMusic();
  persist();
 }

 if(e.target.id==="volume"){
  data.volume=+e.target.value;
  if(musicNodes)musicNodes.gain.gain.value=data.volume;
  persist();
 }

 if(e.target.id==="notificationToggle"){
  data.notificationsEnabled=e.target.checked;
  persist();
  if(data.notificationsEnabled)enableNotifications();
 }
});

/* =====================================
   20. START APP
===================================== */

updateStats();

if(!firebaseReady){
 $("authMessage").textContent=
  "Firebase configuration is required for online accounts and friends. Guest mode is available.";
}

if(firebaseReady){
 onAuthStateChanged(auth,async u=>{
  if(u){
   user=u;guest=false;
   try{
    await loadCloud();
    showApp();
    dailyReminder();
   }catch(e){
    console.error(e);
    showApp();
   }
  }
 });
}

</script>
</body>
</html>
